<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0a14" />
    <meta name="description" content="KORONA — arena PvP: zabij bossa, przejmij koronę, zostań bossem." />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>KORONA</title>
  </head>
  <body>
    <canvas id="game" aria-label="Arena"></canvas>
    <div id="touch" class="touch hidden"></div>

    <section id="screen-start" class="screen screen-start">
      <div class="corner-btns">
        <button id="btn-install" class="hidden btn-sm">Zainstaluj</button>
        <button id="btn-settings" class="btn-icon" data-open="settings" aria-label="Ustawienia" title="Ustawienia">
          <svg viewBox="0 0 10 10" shape-rendering="crispEdges" aria-hidden="true"><path fill="currentColor" d="M4 0h2v1h-2zM1 1h1v1h-1zM3 1h4v1h-4zM8 1h1v1h-1zM2 2h6v1h-6zM1 3h3v1h-3zM6 3h3v1h-3zM0 4h3v1h-3zM7 4h3v1h-3zM0 5h3v1h-3zM7 5h3v1h-3zM1 6h3v1h-3zM6 6h3v1h-3zM2 7h6v1h-6zM1 8h1v1h-1zM3 8h4v1h-4zM8 8h1v1h-1zM4 9h2v1h-2z" /></svg>
        </button>
      </div>
      <div class="start-wrap">
        <header class="brand">
          <div class="crown-art" aria-hidden="true"><i></i></div>
          <h1 class="logo" aria-label="KORONA">KORONA</h1>
          <p class="tag">Zabij bossa. Przejmij koronę. Zostań bossem.</p>
        </header>
        <div class="start-panel px-box">
          <label class="field nick-field"><span class="lbl">Nick</span><input id="nick" maxlength="16" autocomplete="off" placeholder="Twój nick" spellcheck="false" /></label>
          <button id="btn-create" class="primary big">Stwórz pokój</button>
          <div class="join-row">
            <input id="join-code" maxlength="5" placeholder="KOD" class="code-input" autocomplete="off" spellcheck="false" aria-label="Kod pokoju" />
            <button id="btn-join">Dołącz kodem</button>
          </div>
          <div class="sep"><span>albo</span></div>
          <button id="btn-local" class="alt">Tryb lokalny <small>(offline, 2–8 graczy)</small></button>
        </div>
      </div>
      <p id="start-msg" class="msg"></p>
      <p class="foot" id="transport-info"></p>
    </section>

    <section id="screen-lobby" class="screen hidden">
      <header class="screen-head">
        <h2>Pokój <span id="room-code" class="code"></span> <button id="btn-copy" class="btn-sm">Kopiuj / udostępnij</button></h2>
        <div class="head-tools">
          <button class="btn-sm" data-open="bestiary">Bestiariusz</button>
          <button class="btn-icon btn-icon-sm" data-open="settings" aria-label="Ustawienia" title="Ustawienia">
            <svg viewBox="0 0 10 10" shape-rendering="crispEdges" aria-hidden="true"><path fill="currentColor" d="M4 0h2v1h-2zM1 1h1v1h-1zM3 1h4v1h-4zM8 1h1v1h-1zM2 2h6v1h-6zM1 3h3v1h-3zM6 3h3v1h-3zM0 4h3v1h-3zM7 4h3v1h-3zM0 5h3v1h-3zM7 5h3v1h-3zM1 6h3v1h-3zM6 6h3v1h-3zM2 7h6v1h-6zM1 8h1v1h-1zM3 8h4v1h-4zM8 8h1v1h-1zM4 9h2v1h-2z" /></svg>
          </button>
        </div>
      </header>
      <div class="lobby-grid">
        <div class="lobby-side px-box">
          <h3>Gracze</h3>
          <ul id="lobby-players" class="players"></ul>
          <div class="row lobby-actions">
            <button id="btn-ready">Gotowy</button>
            <button id="btn-start" class="primary hidden">Start</button>
            <button id="btn-leave" class="danger">Wyjdź</button>
          </div>
          <p id="lobby-msg" class="msg"></p>
        </div>
        <div class="lobby-main">
          <h3>Wybierz bohatera</h3>
          <div class="skins" id="lobby-skins"></div>
        </div>
      </div>
    </section>

    <section id="screen-modes" class="screen hidden">
      <header class="screen-head">
        <h2>Walka z botami</h2>
        <div class="head-tools">
          <button class="btn-sm" data-open="bestiary">Bestiariusz</button>
          <button class="btn-sm" data-open="settings">Sterowanie</button>
        </div>
      </header>
      <div id="mode-root" class="mode-root"></div>
      <div class="row bottom-bar">
        <button id="btn-mode-back">Wróć</button>
        <button id="btn-mode-start" class="primary">Graj</button>
      </div>
    </section>

    <section id="screen-local" class="screen hidden">
      <header class="screen-head">
        <h2>Tryb lokalny</h2>
        <div class="head-tools">
          <button class="btn-sm" data-open="bestiary">Bestiariusz</button>
          <button class="btn-sm" data-open="settings">Sterowanie</button>
        </div>
      </header>
      <div class="row local-opts"><select id="local-map" aria-label="Mapa"></select><select id="local-level" aria-label="Trudność botów"></select></div>
      <p id="local-info" class="small"></p>
      <div id="local-slots" class="slots"></div>
      <div class="row bottom-bar">
        <button id="btn-local-back">Wróć</button>
        <button id="btn-local-add">+ Bot / gracz</button>
        <button id="btn-local-fill">Wypełnij botami</button>
        <button id="btn-local-start" class="primary">Graj</button>
      </div>
    </section>

    <section id="screen-summary" class="screen hidden">
      <h2 id="summary-title" class="summary-title">Koniec meczu</h2>
      <div id="podium" class="podium"></div>
      <div class="table-wrap px-box"><table id="summary-table" class="stats"></table></div>
      <div class="row">
        <button id="btn-summary-back">Menu</button>
        <button id="btn-rematch" class="primary">Rewanż</button>
      </div>
      <p id="summary-msg" class="msg"></p>
    </section>

    <div id="overlay" class="overlay hidden"><div id="overlay-text"></div></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
